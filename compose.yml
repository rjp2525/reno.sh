# Local development stack. Production runs on Laravel Forge (see deploy/forge).
#
#   docker compose up -d                 # app, queue, scheduler, vite, tui, pgsql, mailpit
#   docker compose exec app php artisan migrate --seed
#
# Host ports default to non-standard values so this can run beside other projects.

x-app: &app
    build:
        context: ./docker/app
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP:-20}'
    image: reno-sh/app:dev
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER:-501}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
        - '.:/var/www/html'
    networks:
        - reno
    depends_on:
        pgsql:
            condition: service_healthy
        mailpit:
            condition: service_started

services:
    app:
        <<: *app
        ports:
            - '${APP_PORT:-8088}:80'

    queue:
        <<: *app
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=600', '--sleep=1']
        restart: unless-stopped

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        restart: unless-stopped

    vite:
        <<: *app
        # Linux node_modules live in a volume so they never clash with the host's (macOS) install.
        command: ['sh', '-c', 'pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0']
        ports:
            - '${VITE_PORT:-5188}:${VITE_PORT:-5188}'
        environment:
            WWWUSER: '${WWWUSER:-501}'
            VITE_PORT: '${VITE_PORT:-5188}'
            npm_config_store_dir: /var/www/html/node_modules/.pnpm-store
        volumes:
            - '.:/var/www/html'
            - 'node-modules:/var/www/html/node_modules'
        depends_on: []

    # Interactive terminal version of the site: ssh -p 2222 localhost
    tui:
        build:
            context: ./tui
        image: reno-sh/tui:dev
        environment:
            RENO_API_URL: 'http://app'
            RENO_SSH_PORT: '2222'
            RENO_HOST_KEY_PATH: '/data/host_ed25519'
        ports:
            - '${TUI_SSH_PORT:-2222}:2222'
        volumes:
            - 'tui-data:/data'
        networks:
            - reno
        depends_on:
            - app
        profiles: ['tui']

    pgsql:
        image: 'postgres:18.7-alpine'
        ports:
            - '${FORWARD_DB_PORT:-54320}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-reno}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - reno
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE:-reno}', '-U', '${DB_USERNAME:-sail}']
            interval: 2s
            retries: 15
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:v1.33.1'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1026}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8026}:8025'
        networks:
            - reno

networks:
    reno:
        driver: bridge

volumes:
    pgsql:
        driver: local
    tui-data:
        driver: local
    node-modules:
        driver: local
